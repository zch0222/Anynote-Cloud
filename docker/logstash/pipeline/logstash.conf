input {
  # 接收 Spring Boot 通过 logback-logstash-encoder 发送的 JSON 日志
  tcp {
    port  => 4560
    codec => json_lines
  }
  # 兼容 Filebeat / Beats 采集器
  beats {
    port => 5044
  }
}

filter {
  # 将 @timestamp 统一为 Asia/Shanghai 时区展示字段
  date {
    match       => ["timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"]
    target      => "@timestamp"
    timezone    => "Asia/Shanghai"
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts    => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
    index    => "anynote-logs-%{[app_name]:unknown}-%{+YYYY.MM.dd}"
    # ES 8.x 已关闭 xpack.security，无需认证
  }
}
