# Sample Logstash configuration for creating a simple
# Beats -> Logstash -> Elasticsearch pipeline.

input {
  tcp {
    port => 5044
    codec => json
    type => "anynote-note"
  }
  tcp {
    port => 5045
    codec => json
    type => "anynote-ai-nio"
  }
  tcp {
    port => 5046
    codec => json
    type => "anynote-system"
  }
  tcp {
    port => 5047
    codec => json
    type => "anynote-ai"
  }
  tcp {
    port => 5048
    codec => json
    type => "anynote-admin"
  }
  tcp {
    port => 5049
    codec => json
    type => "anynote-auth"
  }
  tcp {
    port => 5050
    codec => json
    type => "anynote-file"
  }
  tcp {
    port => 5051
    codec => json
    type => "anynote-gateway"
  }
  tcp {
    port => 5052
    codec => json
    type => "anynote-manage"
  }
  tcp {
    port => 5053
    codec => json
    type => "anynote-notify"
  }
  tcp {
    port => 5054
    codec => json
    type => "anynote-job"
  }
}

filter {
  if [logger_name] == "RequestLogger" and [level] == "INFO" {
    # 解析 message 字段中的 JSON
    json {
      source => "message"
      target => "log_data"
    }

    # 将解析后的字段提升到顶层
    mutate {
      rename => {
        "[log_data][url]" => "url"
        "[log_data][method]" => "method"
        "[log_data][ip]" => "ip"
        "[log_data][requestArgs]" => "requestArgs"
        "[log_data][response]" => "response"
        "[log_data][success]" => "success"
        "[log_data][errorMsg]" => "errorMsg"
        "[log_data][timeConsuming]" => "timeConsuming"
        "[log_data][userId]" => "userId"
        "[log_data][userName]" => "userName"
        "[log_data][nickName]" => "nickName"
      }
      remove_field => ["log_data", "message"] # 移除中间字段和原始 message
    }

    # 确保 type 字段被保留
    mutate {
      add_field => {
        "original_type" => "%{type}"
      }
    }
  }
}

output {
  if [logger_name] == "RequestLogger" and [level] == "INFO" {
      elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "anynote-request-log-%{+YYYY.MM.dd}"
      template_overwrite => true
      template => "/Users/zch/software/logstash-8.7.0/config/log-template.json" # 指定映射模板路径
      template_name => "anynote-log-template"
      # 只存储需要的字段
      #user => "elastic"
      #password => "changeme"
    }
  }
  if [type] == "anynote-note" {
    elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "anynote-note-%{+YYYY.MM.dd}"
      template_overwrite => "false"
      #user => "elastic"
      #password => "changeme"
    }
  }
  if [type] == "anynote-ai-nio" {
    elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "anynote-ai-nio-%{+YYYY.MM.dd}"
      template_overwrite => "false"
